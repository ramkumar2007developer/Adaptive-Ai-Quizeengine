<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" style="background:#0b0f19;">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <text x="400" y="40" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="22" font-weight="bold">Adaptive Quiz Generator Architecture</text>

  <!-- Frontend Box -->
  <rect x="50" y="100" width="220" height="260" rx="16" fill="rgba(18,26,43,0.8)" stroke="#6366f1" stroke-width="2" />
  <text x="160" y="135" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">React Frontend (Vite)</text>
  <rect x="70" y="160" width="180" height="40" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="160" y="185" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Pages &amp; Routing</text>
  <rect x="70" y="215" width="180" height="40" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="160" y="240" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Question UI &amp; Badges</text>
  <rect x="70" y="270" width="180" height="60" rx="8" fill="url(#grad1)" />
  <text x="160" y="305" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">API Service Client</text>

  <!-- Arrow -->
  <path d="M 270 230 L 330 230" stroke="#06b6d4" stroke-width="3" marker-end="url(#arrow)" />
  <text x="300" y="220" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="11">JSON / REST</text>

  <!-- Express Backend Box -->
  <rect x="330" y="100" width="220" height="260" rx="16" fill="rgba(18,26,43,0.8)" stroke="#a855f7" stroke-width="2" />
  <text x="440" y="135" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">Express API Server</text>
  <rect x="350" y="160" width="180" height="40" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="440" y="185" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">Quiz &amp; Answer Router</text>
  <rect x="350" y="215" width="180" height="40" rx="8" fill="url(#grad2)" />
  <text x="440" y="240" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Adaptive Engine</text>
  <rect x="350" y="270" width="180" height="60" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="440" y="305" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="13">LLM Service Wrapper</text>

  <!-- Arrow -->
  <path d="M 550 230 L 610 230" stroke="#a855f7" stroke-width="3" />

  <!-- LLM & Fallback Bank Box -->
  <rect x="610" y="100" width="140" height="260" rx="16" fill="rgba(18,26,43,0.8)" stroke="#10b981" stroke-width="2" />
  <text x="680" y="135" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">AI Engine</text>
  <rect x="625" y="160" width="110" height="50" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="680" y="190" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12">Gemini API</text>
  <rect x="625" y="230" width="110" height="100" rx="8" fill="rgba(255,255,255,0.05)" />
  <text x="680" y="275" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Dynamic Prompt</text>
  <text x="680" y="295" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Templates</text>
</svg>
