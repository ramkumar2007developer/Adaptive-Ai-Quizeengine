<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background:#0b0f19;">
  <text x="400" y="35" text-anchor="middle" fill="#f8fafc" font-family="sans-serif" font-size="20" font-weight="bold">Adaptive Quiz Question &amp; Answer Flow</text>

  <!-- Actors -->
  <text x="100" y="80" text-anchor="middle" fill="#6366f1" font-family="sans-serif" font-size="14" font-weight="bold">User / Client</text>
  <line x1="100" y1="95" x2="100" y2="360" stroke="#6366f1" stroke-dasharray="4" />

  <text x="400" y="80" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">Express API</text>
  <line x1="400" y1="95" x2="400" y2="360" stroke="#a855f7" stroke-dasharray="4" />

  <text x="700" y="80" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="14" font-weight="bold">Adaptive Engine</text>
  <line x1="700" y1="95" x2="700" y2="360" stroke="#06b6d4" stroke-dasharray="4" />

  <!-- Flow 1: Start -->
  <line x1="100" y1="120" x2="400" y2="120" stroke="#f8fafc" stroke-width="2" />
  <text x="250" y="115" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">POST /api/quiz/start</text>

  <line x1="400" y1="145" x2="700" y2="145" stroke="#06b6d4" stroke-width="2" />
  <text x="550" y="140" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="12">Generate Initial (Medium) Question</text>

  <line x1="400" y1="180" x2="100" y2="180" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
  <text x="250" y="175" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12">200 OK: session &amp; Q1</text>

  <!-- Flow 2: Answer -->
  <line x1="100" y1="220" x2="400" y2="220" stroke="#f8fafc" stroke-width="2" />
  <text x="250" y="215" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">POST /api/quiz/answer (choice, time)</text>

  <line x1="400" y1="245" x2="700" y2="245" stroke="#a855f7" stroke-width="2" />
  <text x="550" y="240" text-anchor="middle" fill="#a855f7" font-family="sans-serif" font-size="12">Evaluate Accuracy &amp; Update Streak</text>

  <rect x="620" y="260" width="160" height="35" rx="6" fill="rgba(6,182,212,0.2)" stroke="#06b6d4" />
  <text x="700" y="282" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="11" font-weight="bold">Adjust Difficulty (Easy/Med/Hard)</text>

  <line x1="400" y1="325" x2="100" y2="325" stroke="#10b981" stroke-width="2" stroke-dasharray="4" />
  <text x="250" y="320" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="12">Return Evaluation, Shift &amp; Next Q</text>
</svg>
